<!DOCTYPE html>
<html>
<head>
    <title>Register - MediSense AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>MediSense AI</h1>

        <h2>Create Account</h2>

        <form method="POST">

            <input
                type="text"
                name="name"
                placeholder="Full Name"
                required>

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required>

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already have an account?

            <a href="{{ url_for('auth.login') }}">
                Login
            </a>
        </p>

    </div>

</div>

</body>
</html>
