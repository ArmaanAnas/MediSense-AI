<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MediSense AI</title>
</head>
<body>

    <h1>Register</h1>

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Full Name"
            required>

        <br><br>

        <input
            type="email"
            name="email"
            placeholder="Email"
            required>

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <br><br>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required>

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

</body>
</html>
