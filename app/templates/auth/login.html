<!DOCTYPE html>
<html>
<head>
    <title>Login - MediSense AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>MediSense AI</h1>

        <h2>Welcome Back</h2>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?

            <a href="{{ url_for('auth.register') }}">
                Register
            </a>
        </p>

    </div>

</div>

</body>
</html>
