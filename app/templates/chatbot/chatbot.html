<!DOCTYPE html>
<html>
<head>

    <title>AI Health Assistant</title>

    <style>

        body{
            margin:0;
            font-family:'Segoe UI',sans-serif;
            background:#0f172a;
            color:white;
        }

        .container{
            max-width:900px;
            margin:50px auto;
            padding:30px;
        }

        .card{
            background:#1e293b;
            padding:30px;
            border-radius:20px;
        }

        h1{
            color:#06b6d4;
            margin-bottom:25px;
        }

        textarea{
            width:100%;
            height:120px;
            padding:15px;
            border:none;
            border-radius:12px;
            background:#111827;
            color:white;
            font-size:16px;
            resize:none;
        }

        button{
            margin-top:20px;
            padding:14px 24px;
            border:none;
            border-radius:10px;
            background:#06b6d4;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0891b2;
        }

        .response-box{
            margin-top:30px;
            padding:20px;
            border-radius:12px;
            background:#111827;
            border-left:5px solid #06b6d4;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>AI Health Assistant 🤖</h1>

        <form method="POST">

            <textarea
            name="message"
            placeholder="Ask a health-related question..."
            required></textarea>

            <button type="submit">
                Ask AI Assistant
            </button>

        </form>

        {% if response %}

        <div class="response-box">

            <h3>Assistant Response</h3>

            <p>{{ response }}</p>

        </div>

        {% endif %}

    </div>

</div>

</body>
</html>
