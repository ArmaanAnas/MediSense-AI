<!DOCTYPE html>
<html>
<head>

    <title>Diabetes Prediction</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static',
    filename='css/diabetes.css') }}">

</head>
<body>

    <div class="navbar">

        <div class="logo">
            MediSense AI
        </div>

    </div>

    <div class="container">

        <div class="card">

            <h1>Diabetes Risk Predictor</h1>

            <form method="POST">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Pregnancies</label>
                        <input
                        type="number"
                        name="pregnancies"
                        value="{{ request.form.get('pregnancies', '') }}"
                        required>
                    </div>

                    <div class="form-group">
                        <label>Glucose</label>
                        <input
                        type="number"
                        name="glucose"
                        value="{{ request.form.get('glucose', '') }}"
                        required>
                    </div>

                    <div class="form-group">
                        <label>Blood Pressure</label>
                        <input
                        type="number"
                        name="blood_pressure"
                        value="{{ request.form.get('blood_pressure', '') }}"
                        required>
                    </div>

                    <div class="form-group">
                        <label>Skin Thickness</label>
                        <input
                        type="number"
                        name="skin_thickness"
                        value="{{ request.form.get('skin_thickness', '') }}"
                        required>
                    </div>

                    <div class="form-group">
                        <label>Insulin</label>
                        <input
                        type="number"
                        name="insulin"
                        value="{{ request.form.get('insulin', '') }}"
                        required>
                    </div>

                    <div class="form-group">
                        <label>BMI</label>
                        <input
                        type="number"
                        step="0.1"
                        name="bmi"
                        value="{{ request.form.get('bmi', '') }}"
                        required>
                    </div>

                    <div class="form-group">
                        <label>Diabetes Pedigree Function</label>
                        <input
                        type="number"
                        step="0.01"
                        name="dpf"
                        value="{{ request.form.get('dpf', '') }}"
                        required>
                    </div>

                    <div class="form-group">
                        <label>Age</label>
                        <input
                        type="number"
                        name="age"
                        value="{{ request.form.get('age', '') }}"
                        required>
                    </div>

                </div>

                <button
                class="predict-btn"
                type="submit">

                    Predict Risk

                </button>

            </form>

            {% if result %}

            <div class="result-box">

                <h2>
                    Prediction:
                    {{ result }}
                </h2>

                <p>
                    {{ insight }}
                </p>

            </div>

            {% endif %}

        </div>

    </div>

</body>
</html>
