<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Prediction</title>
</head>
<body>

<h1>Diabetes Prediction</h1>

<form method="POST">

    <input type="number"
           name="pregnancies"
           placeholder="Pregnancies"
           required>

    <br><br>

    <input type="number"
           name="glucose"
           placeholder="Glucose"
           required>

    <br><br>

    <input type="number"
           name="blood_pressure"
           placeholder="Blood Pressure"
           required>

    <br><br>

    <input type="number"
           name="skin_thickness"
           placeholder="Skin Thickness"
           required>

    <br><br>

    <input type="number"
           name="insulin"
           placeholder="Insulin"
           required>

    <br><br>

    <input type="number"
           step="0.01"
           name="bmi"
           placeholder="BMI"
           required>

    <br><br>

    <input type="number"
           step="0.01"
           name="dpf"
           placeholder="Diabetes Pedigree Function"
           required>

    <br><br>

    <input type="number"
           name="age"
           placeholder="Age"
           required>

    <br><br>

    <button type="submit">
        Predict
    </button>

</form>

{% if result %}

<h2>
    Prediction: {{ result }}
</h2>

{% endif %}

</body>
</html>
