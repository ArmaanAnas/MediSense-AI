<!DOCTYPE html>
<html>
<head>

    <title>Heart Disease Prediction</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static',
    filename='css/heart.css') }}">

</head>
<body>

<div class="navbar">

    <div class="logo">
        MediSense AI
    </div>

    <div class="nav-links">

        <a href="{{ url_for('auth.dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('prediction.prediction_history') }}">
            Prediction History
        </a>

        <a href="{{ url_for('auth.logout') }}"
           class="logout-btn">
            Logout
        </a>

    </div>

</div>

<div class="container">

    <div class="card">

        <h1>Heart Disease Predictor</h1>

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Age</label>

                    <input
                        type="number"
                        name="age"
                        value="{{ request.form.get('age','') }}"
                        required>
                </div>

                <div class="form-group">
                    <label>Gender</label>

                    <select name="sex" required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="1"
                        {% if request.form.get('sex') == '1' %}
                        selected
                        {% endif %}>
                            Male
                        </option>

                        <option value="0"
                        {% if request.form.get('sex') == '0' %}
                        selected
                        {% endif %}>
                            Female
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Chest Pain Type</label>

                    <select name="cp" required>

                        <option value="">
                            Select Chest Pain Type
                        </option>

                        <option value="0">
                            Typical Angina
                        </option>

                        <option value="1">
                            Atypical Angina
                        </option>

                        <option value="2">
                            Non-Anginal Pain
                        </option>

                        <option value="3">
                            Asymptomatic
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Resting Blood Pressure</label>

                    <input
                        type="number"
                        name="trestbps"
                        value="{{ request.form.get('trestbps','') }}"
                        required>
                </div>

                <div class="form-group">
                    <label>Cholesterol</label>

                    <input
                        type="number"
                        name="chol"
                        value="{{ request.form.get('chol','') }}"
                        required>
                </div>

                <div class="form-group">
                    <label>Fasting Blood Sugar</label>

                    <input
                        type="number"
                        name="fbs"
                        value="{{ request.form.get('fbs','') }}"
                        required>
                </div>

                <div class="form-group">
                    <label>ECG Result</label>

                    <select name="restecg" required>

                        <option value="">
                            Select ECG Result
                        </option>

                        <option value="0">
                            Normal
                        </option>

                        <option value="1">
                            ST-T Wave Abnormality
                        </option>

                        <option value="2">
                            Left Ventricular Hypertrophy
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Maximum Heart Rate</label>

                    <input
                        type="number"
                        name="thalach"
                        value="{{ request.form.get('thalach','') }}"
                        required>
                </div>

                <div class="form-group">
                    <label>Exercise Induced Angina</label>

                    <select name="exang" required>

                        <option value="">
                            Select Option
                        </option>

                        <option value="0">
                            No
                        </option>

                        <option value="1">
                            Yes
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Old Peak</label>

                    <input
                        type="number"
                        step="0.1"
                        name="oldpeak"
                        value="{{ request.form.get('oldpeak','') }}"
                        required>
                </div>

                <div class="form-group">
                    <label>Slope</label>

                    <select name="slope" required>

                        <option value="">
                            Select Slope
                        </option>

                        <option value="0">
                            Upsloping
                        </option>

                        <option value="1">
                            Flat
                        </option>

                        <option value="2">
                            Downsloping
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>CA</label>

                    <input
                        type="number"
                        name="ca"
                        value="{{ request.form.get('ca','') }}"
                        required>
                </div>

                <div class="form-group">
                    <label>Thal Type</label>

                    <select name="thal" required>

                        <option value="">
                            Select Thal Type
                        </option>

                        <option value="1">
                            Normal
                        </option>

                        <option value="2">
                            Fixed Defect
                        </option>

                        <option value="3">
                            Reversible Defect
                        </option>

                    </select>
                </div>

            </div>

            <button
            class="predict-btn"
            type="submit">

                Predict Heart Disease

            </button>

        </form>

        {% if result %}

<div class="result-box {% if result == 'Low Risk' %}low-risk{% else %}high-risk{% endif %}">

    <h2>
        Result: {{ result }}
    </h2>

    <h3>
        Confidence: {{ confidence }}%
    </h3>

    <p>
        {{ insight }}
    </p>

    <br>

    <a
    href="{{ url_for('auth.dashboard') }}"
    class="dashboard-btn">

        Back to Dashboard

    </a>

</div>

{% endif %}

    </div>

</div>

</body>
</html>
