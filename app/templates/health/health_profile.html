<!DOCTYPE html>
<html>
<head>
    <title>Health Profile</title>
</head>
<body>

    <h1>Create Health Profile</h1>

    <form method="POST">

        <input type="number"
               name="age"
               placeholder="Age"
               required>

        <br><br>

        <select name="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <br><br>

        <input type="number"
               step="0.01"
               name="height"
               placeholder="Height (cm)"
               required>

        <br><br>

        <input type="number"
               step="0.01"
               name="weight"
               placeholder="Weight (kg)"
               required>

        <br><br>

        <input type="text"
               name="blood_pressure"
               placeholder="Blood Pressure"
               required>

        <br><br>

        <input type="number"
               step="0.01"
               name="blood_sugar"
               placeholder="Blood Sugar"
               required>

        <br><br>

        <input type="number"
               step="0.01"
               name="cholesterol"
               placeholder="Cholesterol"
               required>

        <br><br>

        <input type="text"
               name="smoking_status"
               placeholder="Smoking Status"
               required>

        <br><br>

        <input type="text"
               name="exercise_frequency"
               placeholder="Exercise Frequency"
               required>

        <br><br>

        <input type="text"
               name="family_history"
               placeholder="Family History"
               required>

        <br><br>

        <button type="submit">
            Save Profile
        </button>

    </form>

</body>
</html>
