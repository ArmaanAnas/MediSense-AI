<!DOCTYPE html>
<html>

<head>

    <title>Health Profile - MediSense AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">

    <style>

        .profile-container{
            max-width:1000px;
            margin:40px auto;
            padding:20px;
        }

        .profile-card{
            background:#1e293b;
            padding:35px;
            border-radius:20px;
        }

        .profile-card h1{
            text-align:center;
            color:#06b6d4;
            margin-bottom:30px;
        }

        .form-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .form-group{
            display:flex;
            flex-direction:column;
        }

        .form-group label{
            margin-bottom:8px;
            color:#94a3b8;
        }

        .form-group input,
        .form-group select{
            padding:14px;
            border:none;
            border-radius:10px;
            background:#111827;
            color:white;
            font-size:15px;
        }

        .save-btn{
            margin-top:30px;
            width:100%;
            padding:16px;
            border:none;
            border-radius:12px;
            background:#06b6d4;
            color:white;
            font-size:18px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        .save-btn:hover{
            background:#0891b2;
        }

    </style>

</head>

<body>

<div class="navbar">

    <div class="logo">
        MediSense AI
    </div>

    <div class="nav-links">

        <a href="{{ url_for('auth.logout') }}"
           class="logout-btn">
            Logout
        </a>

    </div>

</div>

<div class="profile-container">

    <div class="profile-card">

        <h1>
            Create Health Profile
        </h1>

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Age</label>

                    <input
                        type="number"
                        name="age"
                        required>
                </div>

                <div class="form-group">
                    <label>Gender</label>

                    <select name="gender">

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Height (cm)</label>

                    <input
                        type="number"
                        step="0.01"
                        name="height"
                        required>
                </div>

                <div class="form-group">
                    <label>Weight (kg)</label>

                    <input
                        type="number"
                        step="0.01"
                        name="weight"
                        required>
                </div>

                <div class="form-group">
                    <label>Blood Pressure</label>

                    <input
                        type="text"
                        name="blood_pressure"
                        placeholder="120/80"
                        required>
                </div>

                <div class="form-group">
                    <label>Blood Sugar</label>

                    <input
                        type="number"
                        step="0.01"
                        name="blood_sugar"
                        required>
                </div>

                <div class="form-group">
                    <label>Cholesterol</label>

                    <input
                        type="number"
                        step="0.01"
                        name="cholesterol"
                        required>
                </div>

                <div class="form-group">
                    <label>Smoking Status</label>

                    <select name="smoking_status">

                        <option value="No">
                            No
                        </option>

                        <option value="Yes">
                            Yes
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Exercise Frequency</label>

                    <select name="exercise_frequency">

                        <option value="Daily">
                            Daily
                        </option>

                        <option value="3-5 Times Weekly">
                            3-5 Times Weekly
                        </option>

                        <option value="Rarely">
                            Rarely
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Family History</label>

                    <input
                        type="text"
                        name="family_history"
                        placeholder="Diabetes, Heart Disease, None"
                        required>
                </div>

            </div>

            <button
                type="submit"
                class="save-btn">

                Save Health Profile

            </button>

        </form>

    </div>

</div>

</body>

</html>
